  <header class="topline"><div class="brand">BET <span>BD1</span></div><p>Jogo de Banco de Dados</p><button id="projector-exit" class="projector-exit" type="button" onclick="toggleProjector(false)" hidden>Voltar ao painel</button></header>
  <main class="board">
    <section class="panel score-panel" aria-label="Placar ao vivo"><h2 class="score-title">Placar ao vivo <small>Bet BD1</small></h2><div id="scores" class="score-grid"></div></section>
    <section class="panel question-panel" aria-label="Pergunta"><div class="ribbon red">Pergunta</div><div id="question" class="question-content"></div></section>
    <section id="roulette" class="panel roulette-panel" aria-label="Roleta de bônus" hidden></section>
    <section id="mines" class="panel mines-panel" aria-label="Campo minado" hidden></section>
    <section id="streak-wheel" class="panel roulette-panel streak-panel" aria-label="Roleta especial" hidden></section>
    <div class="lower">
      <section class="panel answers-panel" aria-label="Respostas"><div class="ribbon yellow">Respostas</div><div id="answers"></div></section>
      <aside class="panel info-panel" aria-label="Outros dados"><div class="ribbon red">Outros dados</div><div id="info"></div></aside>
    </div>
    <p id="message" class="error" role="alert" aria-live="polite"></p>
    <section id="admin" class="panel admin-panel" aria-label="Área do criador"></section>
    <section class="panel roster-panel" aria-label="Integrantes das equipes"><h2>Equipes e participantes</h2><div id="roster" class="roster-grid"></div></section>
  </main>
  <script>
    let state=null,order=[],lastRound='',lastSignature='',busy=false,editing=null,projectorMode=false;
    const CLIENT_VERSION='game-settings-1';
    const names=['Azul','Laranja','Amarela','Roxa'],emojis=['🔵','🟠','🟡','🟣'];
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'content-type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const x=await r.json();if(!r.ok)throw Error(x.error||'Não foi possível concluir a ação.');return x}
    async function act(path,data){if(busy)return false;busy=true;try{await api(path,data);$('message').textContent='';document.activeElement?.blur?.();await refresh(true);return true}catch(e){$('message').textContent=e.message;return false}finally{busy=false}}
    function shuffle(){order=[1,2,3];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
    const teamLabel=i=>emojis[i]+' Equipe '+names[i];
    const points=n=>String(Math.round(Number(n)*10)/10||0);
    const deltaText=n=>{const value=Math.round(Number(n)*10)/10;return value>0?'+'+points(value):value<0?points(value):'0'};
    const deltaTone=n=>{const value=Math.round(Number(n)*10)/10;return value>0?'plus':value<0?'minus':'zero'};
    function streakPie(count){const paths=['M50 50 L50 4 A46 46 0 0 1 89.84 73 Z','M50 50 L89.84 73 A46 46 0 0 1 10.16 73 Z','M50 50 L10.16 73 A46 46 0 0 1 50 4 Z'];return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#0b111c" stroke-width="3"/>'+paths.map((path,j)=>'<path d="'+path+'" fill="'+(j<count?'#ffdb23':'#f3f0e4')+'" stroke="#0b111c" stroke-width="3"/>').join('')+'</svg>'}
    function scoreHtml(s){const active=['answer','survival'].includes(s.phase)?s.current?.team:['roulette_offer','roulette_choice','roulette_spin'].includes(s.phase)?s.roulette?.team:['mines_offer','mines'].includes(s.phase)?s.mines?.team:['streak_offer','streak_spin'].includes(s.phase)?s.streakWheel?.team:null;return s.scores.map((v,i)=>{const count=s.streaks?.[i]??0,ready=count===3,canOpen=ready&&s.me?.team===i&&s.phase==='review'&&!projectorMode&&!s.out.includes(i);return '<div class="team '+(active===i?'responding ':'')+(s.out.includes(i)?'eliminated':'')+'" data-team="'+i+'"><div class="team-top"><span class="team-name">'+teamLabel(i)+(s.me?.team===i?' <span class="you">🙋 Você</span>':'')+'</span><button type="button" class="streak-pie '+(ready?'ready':'')+'" aria-label="Equipe '+names[i]+': '+count+' de 3 acertos'+(ready?'. Roleta especial disponível':'')+'" title="'+count+' de 3 acertos'+(ready?' · Clique para abrir a roleta especial':'')+'" '+(canOpen?'onclick="act(\'streak-open\',{})"':'disabled')+'>'+streakPie(count)+'</button></div><div class="score-row"><strong>'+points(v)+'</strong><small>'+s.players.filter(p=>p.team===i).length+' pessoa(s)</small></div>'+(active===i?'<small class="team-state">● '+(['answer','survival'].includes(s.phase)?'Respondendo agora':'Jogando agora')+'</small>':s.out.includes(i)?'<small>Eliminada</small>':s.phase==='bet'&&s.current?.blockedTeams?.includes(i)?'<small>Sem aposta nesta pergunta</small>':'')+'</div>'}).join('')}
    function questionHtml(s){const c=s.current,phase=s.phase,now=Date.now(),sum=s.summary;if(phase==='lobby')return '<div><span class="round-chip">Prontos para jogar?</span><h1>Aguardando a primeira pergunta!</h1><p class="subtext">'+(projectorMode?'Aguardando o criador iniciar o jogo.':'Entre em uma equipe e acompanhe o placar ao vivo.')+'</p></div>';if(phase==='finished')return '<div><span class="round-chip">Fim de jogo</span><h1>🏆 Vitória da '+teamLabel(s.winner)+'!</h1><p class="subtext">'+esc(s.notice)+'</p></div>';if(phase==='mines_offer')return '<div><span class="round-chip">Rodada '+s.round+' · Votação</span><h2>Resposta errada!</h2><p>A equipe decide se joga o campo minado.</p></div>';if(phase==='mines')return '<div><span class="round-chip">Rodada '+s.round+' · Campo minado</span><h2>Resposta errada!</h2><p>Abra diamantes; metade da equipe deve confirmar para receber.</p></div>';if(['roulette_offer','roulette_choice','roulette_spin'].includes(phase))return '<div><span class="round-chip">Rodada '+s.round+' · Roleta</span><h2>Resposta certa!</h2><p>'+esc(s.notice)+'</p></div>';if(['review','survival_wait'].includes(phase)&&sum)return '<div><span class="round-chip">Rodada '+s.round+' concluída</span><h2 class="result '+(sum.correct?'good':'bad')+'">'+(sum.type==='survival'?(sum.correct?'Equipe sobreviveu!':'Equipe eliminada!'):(sum.correct?'Resposta certa!':'Resposta errada!'))+'</h2><p>'+esc(s.notice)+'</p><p class="subtext">'+(phase==='survival_wait'?'Pergunta de sobrevivência a seguir.':'Aguarde a próxima pergunta.')+'</p></div>';if(c?.question){const timer=phase==='bet'?Math.max(0,Math.ceil((c.opensAt-now)/1000)):Math.max(0,Math.ceil((c.deadline-now)/1000));let h='<div><span class="round-chip">Rodada '+s.round+(phase==='survival'?' · Sobrevivência':'')+'</span><p>'+esc(c.displayText??c.question.text)+'</p>'+(phase==='answer'&&c.scrambled?'<p class="subtext">As palavras foram embaralhadas após a aposta.</p>':'');if(phase==='bet'){const me=projectorMode?null:s.me,options=me?(s.betOptions?.[me.team]??[1,2,3].filter(n=>n<=(s.scores[me.team]<0?Math.min(3,-s.scores[me.team]):3))):[];h+=timer?'<p class="subtext">As apostas serão liberadas em instantes.</p>':me&&!s.out.includes(me.team)?'<p class="subtext">Escolha sua aposta. Cada valor pode ser usado uma vez por ciclo.</p><div class="bet-row question-bets">'+order.filter(n=>options.includes(n)).map(n=>'<button class="bet-button" onclick="act(\'bet\',{bet:'+n+'})">Apostar '+n+'</button>').join('')+'</div>'+(options.length?'':'<p class="subtext">Sua equipe não pode apostar nesta pergunta.</p>'):'<p class="subtext">'+(projectorMode?'Aguardando a primeira aposta das equipes.':'Entre em uma equipe para apostar.')+'</p>'}else h+='<div class="count">'+timer+'s</div><p class="subtext">Tempo para responder</p>';return h+'</div>'}return '<div><h2>Rodada concluída</h2><p class="subtext">Aguarde o criador avançar.</p></div>'}
    function choicesHtml(q,canAnswer){return '<div class="choices">'+q.options.map((x,i)=>'<button class="choice" '+(canAnswer?'onclick="act(\'answer\',{option:'+i+'})"':'disabled')+'><span class="letter">'+['A','B','C','D'][i]+')</span><span class="choice-text">'+esc(x)+'</span></button>').join('')+'</div>'}
    function answersHtml(s){
      const c=s.current,phase=s.phase,sum=s.summary;
      if(['review','survival_wait','finished','roulette_offer','roulette_choice','roulette_spin','mines_offer','mines','streak_offer','streak_spin'].includes(phase)&&sum){
        const rr=sum.roulette,mm=sum.mines;
        const people=sum.type==='bet'?'<div class="round-people"><p><strong>Quem apostou na pergunta:</strong> '+esc(sum.bettor||'Nome não registrado')+'</p><p><strong>Quem respondeu:</strong> '+esc(sum.responder||'Tempo esgotado')+'</p>'+(rr?'<p><strong>Roleta:</strong> '+esc(rr.player||'Integrante da equipe')+' apostou '+rr.stake+' ponto(s) no '+rouletteNames[rr.choice]+' e '+(rr.won?'ganhou':'perdeu')+'.</p>':'')+(mm?'<p><strong>Campo minado:</strong> '+esc(mm.player||'Integrante da equipe')+' '+(mm.outcome==='mine'?'encontrou uma mina':'recebeu o bônus')+' após '+mm.diamonds+' diamante(s).</p>':'')+'</div>':'<div class="round-people"><p><strong>Quem respondeu:</strong> '+esc(sum.responder||'Tempo esgotado')+'</p></div>';
        return people+'<div class="delta-list">'+sum.changes.map((delta,i)=>{
          const extra=rr?.changes?.[i]??mm?.changes?.[i]??0,roundChange=Math.round((delta-extra)*10)/10;
          const label=rr?'roleta':'campo minado';
          const amount=rr||mm?'<span class="delta-equation"><span class="'+deltaTone(roundChange)+'">('+deltaText(roundChange)+' rodada)</span> <span class="delta-op">+</span> <span class="'+deltaTone(extra)+'">('+deltaText(extra)+' '+label+')</span> <span class="delta-op">=</span> <strong class="'+deltaTone(delta)+'">'+deltaText(delta)+' ponto(s)</strong></span>':deltaText(delta)+' ponto(s)';
          return '<div class="delta-row"><span>'+teamLabel(i)+'</span><span class="'+(rr||mm?'':deltaTone(delta))+'">'+amount+'</span></div>'
        }).join('')+'</div><p class="answer-foot">Resposta correta: '+esc(sum.correctAnswer)+'</p>'
      }
      if(c?.question){const canAnswer=!projectorMode&&['answer','survival'].includes(phase)&&s.me?.team===c.team;return choicesHtml(c.question,canAnswer)+(canAnswer?'<p class="answer-foot">Sua equipe está respondendo. Toque na alternativa correta.</p>':'<p class="answer-foot">'+(phase==='bet'?'As alternativas estão visíveis. Aposte abaixo da pergunta quando liberar.':'Acompanhe a resposta da equipe destacada no placar.')+'</p>')}
      return '<div class="choices">'+['A','B','C','D'].map(x=>'<div class="choice placeholder"><span class="letter">'+x+')</span><span class="choice-text">Aguardando pergunta</span></div>').join('')+'</div>'
    }
    function infoHtml(s){const me=s.me,c=s.current,phase=s.phase;let h='<div class="statusline">'+esc(s.notice)+'</div>';if(me){h+='<div class="member"><h3>'+emojis[me.team]+' Sua equipe</h3><p>Você é <strong>'+esc(me.name)+'</strong> na <strong>Equipe '+names[me.team]+' 🙋</strong>.</p>'+(phase==='lobby'?'<button class="secondary danger-button" onclick="act(\'leave\',{})">Sair da equipe</button>':'<p class="info-note">A troca de equipe fica fechada após o início do jogo.</p>')+'</div>'}else{h+='<h3>Entre no jogo</h3><label for="name">Seu nome</label><input id="name" maxlength="32" placeholder="Digite seu nome"><label for="team">Equipe</label><select id="team"><option value="">Escolha uma equipe</option>'+names.map((n,i)=>'<option value="'+i+'">'+emojis[i]+' '+n+'</option>').join('')+'</select><p><button class="primary" onclick="join()">Entrar na equipe</button></p>'}if(phase==='bet')h+='<div class="member"><h3>Aposta</h3><p>Os botões aparecem abaixo da pergunta após a espera inicial.</p></div>';if(['answer','survival'].includes(phase))h+='<div class="member"><h3>Em andamento</h3><p><strong>'+teamLabel(c.team)+'</strong> está respondendo'+(phase==='answer'?' por <strong>'+c.bet+' ponto(s)</strong>.':' à pergunta de sobrevivência.')+'</p></div>';if(phase==='survival_wait')h+='<div class="member"><h3>Próximo desafio</h3><p>'+teamLabel(c.team)+' enfrentará uma pergunta de sobrevivência.</p></div>';h+='<p class="info-note">4 equipes · 5 pontos iniciais · aposta até 3 · vitória aos 16.</p>';return h}
    function gameSettingsHtml(s,open){const disabled=s.phase==='finished'?' disabled':'';return '<details id="gamedetails" '+(open?'open':'')+'><summary>Editar jogo</summary><p class="quiet">Altere a meta ou a pontuação de uma equipe por vez. Durante a partida, atingir a meta encerra o jogo.</p>'+(disabled?'<p class="quiet">A partida terminou. Reinicie o jogo para editar os pontos.</p>':'')+'<div class="game-settings"><div class="game-setting"><label for="winScore">Pontos para vencer</label><input id="winScore" type="number" min="6" max="100" step="1" value="'+(s.winScore??16)+'"'+disabled+'><button class="primary" onclick="saveWinScore()"'+disabled+'>Salvar meta</button></div>'+s.scores.map((score,i)=>'<div class="game-setting"><label for="teamScore'+i+'">'+teamLabel(i)+'</label><input id="teamScore'+i+'" type="number" min="-100" max="100" step="0.1" value="'+points(score)+'"'+disabled+'><button class="secondary" onclick="saveTeamScore('+i+')"'+disabled+'>Salvar pontos</button></div>').join('')+'</div></details>'}
    function adminHtml(s){const c=s.current,phase=s.phase,codeDraft=$('code')?.value||'',bankOpen=$('bankdetails')?.open||false,gameOpen=$('gamedetails')?.open||false;if(!s.owner){$('admin').innerHTML='<div class="creator-login"><strong>Sou o criador</strong><input id="code" type="password" aria-label="Código do criador" placeholder="Digite o código" onkeydown="if(event.key===\'Enter\')login()"><button class="primary" onclick="login()">Validar código</button></div>';$('code').value=codeDraft;return}const status=phase==='lobby'?'Aguardando início':phase==='bet'?'Apostas abertas':phase==='answer'?'Equipe respondendo':phase==='survival'?'Sobrevivência':phase==='review'?'Resumo da rodada':phase==='survival_wait'?'Sobrevivência pendente':phase==='roulette_offer'?'Votação da roleta':phase==='mines_offer'?'Votação do campo minado':phase==='roulette_choice'?'Escolha da roleta':phase==='roulette_spin'?'Roleta girando':phase==='mines'?'Campo minado':phase==='streak_offer'?'Roleta especial disponível':phase==='streak_spin'?'Roleta especial girando':'Jogo encerrado';const activeTeam=c?.team??s.vote?.team??s.mines?.team??s.roulette?.team??s.streakWheel?.team,active=activeTeam===undefined?'—':teamLabel(activeTeam);const nextLabel=phase==='survival_wait'?'Iniciar sobrevivência':s.round?'Próxima pergunta':'Iniciar jogo';let live='<div class="admin-live"><div><span>Momento</span>'+status+'</div><div><span>Equipe da vez</span>'+active+'</div><div><span>Rodada / aposta</span>'+s.round+' / '+(c?.bet?c.bet+' ponto(s)':'—')+'</div></div>';if(c?.question)live+='<p><strong>Pergunta atual:</strong> '+esc(c.question.text)+'</p>'+(Number.isInteger(c.question.correct)?'<p class="quiet"><strong>Resposta correta:</strong> '+esc(c.question.options[c.question.correct])+'</p>':'');if(s.summary&&['review','survival_wait','finished'].includes(phase))live+='<p><strong>Resultado:</strong> '+esc(s.notice)+'</p>';$('admin').innerHTML='<h2>Painel do criador</h2><p class="quiet">Acompanhe a rodada aqui. Só você pode avançar a pergunta.</p>'+live+'<div class="admin-toolbar"><button class="primary" onclick="toggleProjector(true)">Modo espectador</button><button class="primary" onclick="act(\'next\',{})" '+(!['lobby','review','survival_wait'].includes(phase)?'disabled':'')+'>'+nextLabel+'</button><button class="secondary" onclick="if(confirm(\'Reiniciar placar e rodadas?\'))act(\'reset\',{})">Reiniciar jogo</button><button class="secondary danger-button" onclick="if(confirm(\'Remover todos os participantes das equipes?\'))act(\'clear-teams\',{})">Limpar equipes</button></div>'+gameSettingsHtml(s,gameOpen)+'<details id="bankdetails" '+(bankOpen?'open':'')+'><summary>Banco de questões ('+s.questions.length+')</summary><div class="editor"><div class="wide"><label for="qt">Pergunta</label><input id="qt" placeholder="Digite a pergunta"></div>'+[0,1,2,3].map(i=>'<div><label for="o'+i+'">Alternativa '+['A','B','C','D'][i]+'</label><input id="o'+i+'"></div>').join('')+'<div><label for="correct">Resposta correta</label><select id="correct">'+[0,1,2,3].map(i=>'<option value="'+i+'">Alternativa '+['A','B','C','D'][i]+'</option>').join('')+'</select></div></div><button class="primary" onclick="saveQ()">Salvar pergunta</button> <button class="secondary" onclick="clearQ()">Limpar</button><div class="question-list">'+s.questions.map(q=>'<div class="edititem"><p>'+esc(q.text)+'</p><button class="secondary" onclick="editQ('+q.id+')">Editar</button> <button class="secondary" onclick="act(\'delete\',{id:'+q.id+'})">Excluir</button></div>').join('')+'</div></details>'}
    function voteHtml(s){
      const v=s.vote;if(!v)return '';
      const remaining=Math.max(0,Math.ceil((v.deadline-Date.now())/1000));
      const tie='Empate ou nenhum voto: não jogar.';
      return '<div class="bonus-vote"><p><strong>Votação da equipe · '+remaining+'s</strong></p><p class="vote-count">Jogar: '+v.yes+' voto(s) · Não jogar: '+v.no+' voto(s)</p>'+(v.canVote&&!projectorMode?'<div class="vote-actions"><button type="button" class="primary '+(v.myVote==='yes'?'selected':'')+'" onclick="act(\'bonus-vote\',{choice:\'yes\'})">Jogar</button><button type="button" class="secondary '+(v.myVote==='no'?'selected':'')+'" onclick="act(\'bonus-vote\',{choice:\'no\'})">Não jogar</button></div>':'<p>Aguarde os votos da equipe.</p>')+'<p class="info-note">Um voto por participante. Pode mudar até o tempo acabar. '+tie+'</p></div>'
    }
    function colorVoteHtml(s){
      const v=s.vote;if(!v)return '';
      const remaining=Math.max(0,Math.ceil((v.deadline-Date.now())/1000));
      const options=[['red','Vermelho · +50%','red-choice'],['black','Preto · +50%','black-choice'],['green','Verde · +150%','green-choice']];
      return '<div class="bonus-vote"><p><strong>Votação da cor · '+remaining+'s</strong></p><p class="vote-count">Vermelho: '+v.red+' · Preto: '+v.black+' · Verde: '+v.green+'</p>'+(v.canVote&&!projectorMode?'<div class="vote-actions">'+options.map(([color,label,style])=>'<button type="button" class="primary '+style+' '+(v.myVote===color?'selected':'')+'" onclick="act(\'roulette-choose\',{color:\''+color+'\'})">'+label+'</button>').join('')+'</div>':'<p>Aguarde os votos da equipe.</p>')+'<p class="info-note">Um voto por participante. Pode mudar até o tempo acabar. Empate ou nenhum voto: sorteio entre as cores empatadas.</p></div>'
    }
    const rouletteNames={red:'vermelho',black:'preto',green:'verde'};
    function wheelSvg(){const polar=(radius,angle)=>[200+radius*Math.cos(angle*Math.PI/180),200+radius*Math.sin(angle*Math.PI/180)];let wedges='';for(let i=0;i<36;i++){const a=-90+i*10,b=a+10,[x1,y1]=polar(176,a),[x2,y2]=polar(176,b),[x3,y3]=polar(132,b),[x4,y4]=polar(132,a),[tx,ty]=polar(154,a+5),color=i===0||i===18?'#08744b':i<18?(i%2===0?'#101923':'#d71936'):(i%2===0?'#d71936':'#101923'),label=i===0?'0':i===18?'00':String(i<18?i:i-1);wedges+='<path d="M'+x1+' '+y1+' A176 176 0 0 1 '+x2+' '+y2+' L'+x3+' '+y3+' A132 132 0 0 0 '+x4+' '+y4+' Z" fill="'+color+'" stroke="#f9c92f" stroke-width="1.5"/><text x="'+tx+'" y="'+ty+'" fill="#fff" font-size="13" font-weight="900" text-anchor="middle" dominant-baseline="central">'+label+'</text>'}return '<svg viewBox="0 0 400 400" role="img" aria-label="Roleta com 17 espaços vermelhos, 17 pretos e dois verdes em lados opostos"><circle cx="200" cy="200" r="197" fill="#84411e" stroke="#25130e" stroke-width="6"/><circle cx="200" cy="200" r="181" fill="#ffcb35"/>'+wedges+'<circle cx="200" cy="200" r="130" fill="#086545" stroke="#f9c92f" stroke-width="5"/><circle cx="200" cy="200" r="82" fill="#ffc436" stroke="#fff2ad" stroke-width="8"/><circle cx="200" cy="200" r="54" fill="#8b411e" stroke="#ffc436" stroke-width="8"/><text x="200" y="209" fill="#fff" font-size="28" font-weight="900" text-anchor="middle">BD1</text></svg>'}
    function rouletteHtml(s){const r=s.roulette;if(!r)return '';const team=teamLabel(r.team),eligible=s.me?.team===r.team,phase=s.phase;if(phase==='roulette_offer')return '<h2>🎰 Votação da roleta</h2><p class="roulette-status">'+team+' ganhou '+r.stake+' ponto(s) nesta rodada. A equipe decide se quer arriscar.</p>'+voteHtml(s);if(!['roulette_choice','roulette_spin','review','survival_wait','finished'].includes(phase))return '';if(r.status!=='choice'&&r.status!=='spin'&&r.status!=='result')return '';const angle=r.slot===undefined?0:1440-(r.slot+.5)*10,elapsed=r.startedAt?Math.max(0,Math.min(6000,Date.now()-r.startedAt)):0,spin=r.status==='spin',landed=r.status==='result',wheel='<div class="wheel-stage"><span class="wheel-pointer" aria-hidden="true"></span><div class="wheel-svg '+(spin?'spin':landed?'landed':'')+'" style="--turn:'+angle+'deg;animation-delay:-'+elapsed+'ms">'+wheelSvg()+'</div></div>';let h='<h2>🎰 Roleta da '+team+'</h2>'+wheel;if(phase==='roulette_choice')h+='<p>Vote na cor para apostar '+r.stake+' ponto(s) ganhos na rodada.</p>'+colorVoteHtml(s)+'<p class="info-note">Chances da roleta: vermelho 17/36 · preto 17/36 · verde 2/36.</p>';else if(spin)h+='<p class="roulette-status">A roleta está girando... <strong>'+esc(r.player||'Integrante da equipe')+'</strong> apostou '+r.stake+' ponto(s) no <strong>'+rouletteNames[r.choice]+'</strong>.</p>';else if(landed)h+='<p class="roulette-outcome '+r.result+'">'+esc(r.player||'Integrante da equipe')+' apostou no '+rouletteNames[r.choice]+'. Caiu '+rouletteNames[r.result]+' · '+(s.summary?.roulette?.won?'ganhou '+deltaText(s.summary.roulette.delta):'perdeu '+r.stake)+' ponto(s)</p>';return h}
    function minesHtml(s){
      const m=s.mines;if(!m||!['mines_offer','mines','review','survival_wait','finished'].includes(s.phase))return '';if(s.phase==='mines_offer')return '<h2>💎 Votação do campo minado</h2><p>'+teamLabel(m.team)+' perdeu '+m.stake+' ponto(s) nesta rodada. A equipe decide se quer arriscar para recuperá-los.</p>'+voteHtml(s);
      const playing=s.phase==='mines',eligible=playing&&!projectorMode&&s.me?.team===m.team;
      const bonus=Math.round(m.stake*m.diamonds)/10;
      const tiles=(m.tiles||[]).map((tile,i)=>{
        const opened=m.opened?.includes(i),shown=tile!==null;
        return '<button type="button" class="mine-tile '+(shown?tile+' ':'')+(opened?'opened ':'')+(!playing&&shown?'revealed':'')+'" aria-label="Casa '+(i+1)+(shown?' '+(tile==='mine'?'mina':'diamante'):' fechada')+'" '+(eligible&&!shown?'onclick="act(\'mines-open\',{slot:'+i+'})"':'disabled')+'>'+(shown?(tile==='mine'?'💣':'💎'):'?')+'</button>'
      }).join('');
      let h='<h2>💎 Campo minado</h2><p>'+teamLabel(m.team)+' · 17 diamantes e 8 minas · cada diamante vale 10% da aposta. Se achar uma mina, o bônus acumulado vira perda.</p><div class="mines-grid">'+tiles+'</div>';
      if(playing)h+='<p>'+m.diamonds+' diamante(s) · bônus atual: '+bonus+' ponto(s) · '+Math.max(0,Math.ceil((m.deadline-Date.now())/1000))+'s restantes.</p>'+'<p>Confirmações para receber: '+(m.receiveCount??0)+' de '+(m.receiveRequired??1)+' (pelo menos 50% da equipe).</p>'+(eligible&&m.canReceiveVote&&m.opened?.length?'<div class="mines-actions"><button class="primary" '+(m.myReceiveVote?'disabled':'onclick="act(\'mines-receive\',{})"')+'>'+(m.myReceiveVote?'Você já confirmou':'Confirmar recebimento de '+bonus+' ponto(s)')+'</button></div>':eligible?'<p>Abra uma casa para liberar o botão Receber.</p>':'<p>Aguarde a equipe escolher uma casa ou receber.</p>');
      else h+='<p>'+(m.outcome==='mine'?'Mina encontrada: bônus virou perda.':'Bônus recebido!')+' Todas as casas foram reveladas.</p>';
      return h
    }
    const streakOutcomes=['win','nothing','skip','lose','nothing','skip','lose','nothing','skip','lose'];
    const streakWheelCenter=i=>i===0?5.4:10.8+(i-.5)*38.8;
    function streakWheelSvg(){const polar=(radius,angle)=>[200+radius*Math.cos(angle*Math.PI/180),200+radius*Math.sin(angle*Math.PI/180)],colors={win:'#16855d',skip:'#5365ca',lose:'#d71936',nothing:'#858b91'},labels={win:'★',skip:'SEM VEZ',lose:'−3',nothing:'NADA'};let parts='';for(let i=0;i<10;i++){const start=i===0?0:10.8+(i-1)*38.8,width=i===0?10.8:38.8,a=-90+start,b=a+width,[x1,y1]=polar(175,a),[x2,y2]=polar(175,b),[tx,ty]=polar(i===0?145:128,a+width/2),outcome=streakOutcomes[i];parts+='<path d="M200 200 L'+x1+' '+y1+' A175 175 0 0 1 '+x2+' '+y2+' Z" fill="'+colors[outcome]+'" stroke="#0b111c" stroke-width="3"/><text x="'+tx+'" y="'+ty+'" fill="#fff" font-size="'+(i===0?'18':'17')+'" font-weight="900" text-anchor="middle" dominant-baseline="central">'+labels[outcome]+'</text>'}return '<svg viewBox="0 0 400 400" role="img" aria-label="Roleta especial: vitória em 3% da área e os outros resultados intercalados, com cerca de 32,33% cada"><circle cx="200" cy="200" r="197" fill="#ffdb23" stroke="#0b111c" stroke-width="6"/>'+parts+'<circle cx="200" cy="200" r="70" fill="#ffdb23" stroke="#0b111c" stroke-width="6"/><text x="200" y="209" fill="#0b111c" font-size="20" font-weight="900" text-anchor="middle">3 ACERTOS</text></svg>'}
    function streakWheelHtml(s){const w=s.streakWheel;if(!w)return '';const phase=s.phase;if(!['streak_offer','streak_spin','review','survival_wait','finished'].includes(phase))return '';const spinning=w.status==='spin',result=w.status==='result',eligible=s.me?.team===w.team&&!projectorMode;const angle=w.slot===undefined?0:1440-streakWheelCenter(w.slot),elapsed=w.startedAt?Math.max(0,Math.min(6000,Date.now()-w.startedAt)):0;const labels={win:'Vitória imediata!',skip:'Sem responder na próxima pergunta',lose:'Perdeu 3 pontos',nothing:'Nada aconteceu'};let h='<h2>⭐ Roleta dos 3 acertos</h2><p>'+teamLabel(w.team)+' completou três respostas corretas sem errar.</p><div class="wheel-stage"><span class="wheel-pointer" aria-hidden="true"></span><div class="wheel-svg '+(spinning?'spin':result?'landed':'')+'" style="--turn:'+angle+'deg;animation-delay:-'+elapsed+'ms">'+streakWheelSvg()+'</div></div><div class="streak-odds"><span class="win">Vitória 3%</span><span class="skip">Sem responder ≈32,33%</span><span class="lose">−3 pontos ≈32,33%</span><span class="nothing">Nada ≈32,33%</span></div>';if(w.status==='offer')h+='<p>Se girar, o indicador volta a zero e o resultado será obrigatório.</p>'+(eligible?'<div class="roulette-actions"><button class="primary" onclick="act(\'streak-spin\',{})">Girar roleta</button><button class="secondary" onclick="act(\'streak-cancel\',{})">Agora não</button></div>':'<p>Aguarde a equipe decidir.</p>');else if(spinning)h+='<p>'+esc(w.player)+' girou a roleta. Aguarde o resultado...</p>';else if(result)h+='<p class="roulette-outcome">'+esc(w.player)+' girou: <strong>'+labels[w.outcome]+'</strong>.</p>';return h}
    function rosterHtml(s){return names.map((name,i)=>{const members=s.players.filter(p=>p.team===i);return '<section class="roster-team"><h3>'+teamLabel(i)+' <small>'+members.length+' pessoa(s)</small></h3><table><thead><tr><th scope="col">Integrantes</th></tr></thead><tbody>'+(members.length?members.map(p=>'<tr><td><div class="roster-member"><span>'+esc(p.name)+(s.me?.team===i&&s.me?.name===p.name?' 🙋':'')+'</span>'+(s.owner&&p.id?'<button type="button" class="remove-person" data-id="'+esc(p.id)+'" data-name="'+esc(p.name)+'" aria-label="Remover '+esc(p.name)+' da equipe '+esc(name)+'" title="Remover participante" onclick="removePlayer(this)">×</button>':'')+'</div></td></tr>').join(''):'<tr><td class="empty-team">Nenhum participante ainda</td></tr>')+'</tbody></table></section>'}).join('')}
    function removePlayer(button){if(confirm('Remover '+button.dataset.name+' da equipe?'))act('remove-player',{id:button.dataset.id})}
    function toggleProjector(on){
      if(on&&!state?.owner)return;
      projectorMode=!!on;
      document.body.classList.toggle('projector',projectorMode);
      $('projector-exit').hidden=!projectorMode;
      render();
      if(projectorMode)globalThis.scrollTo?.(0,0);
      else $('admin').scrollIntoView?.({block:'start'});
      if(projectorMode)document.documentElement?.requestFullscreen?.().catch?.(()=>{});
      else if(document.fullscreenElement)document.exitFullscreen?.().catch?.(()=>{});
    }
    document.addEventListener?.('fullscreenchange',()=>{if(projectorMode&&!document.fullscreenElement){projectorMode=false;document.body.classList.remove('projector');$('projector-exit').hidden=true;render()}});
    function renderAdmin(s){
      const fields=['qt','o0','o1','o2','o3','correct','winScore','teamScore0','teamScore1','teamScore2','teamScore3'];
      const focusedId=document.activeElement?.id;
      const draft=Object.fromEntries(fields.filter(id=>!id.startsWith('teamScore')&&id!=='winScore'||id===focusedId).map(id=>[id,$(id)?.value]));
      adminHtml(s);
      if(s.owner)for(const id of fields)if(draft[id]!==undefined&&$(id))$(id).value=draft[id];
    }
    function render(preserveForms=false){const s=state;if(!s)return;if(projectorMode&&!s.owner){projectorMode=false;document.body.classList.remove('projector');$('projector-exit').hidden=true;}$('scores').innerHTML=scoreHtml(s);$('question').innerHTML=['streak_offer','streak_spin'].includes(s.phase)?'<div><span class="round-chip">Roleta especial</span><h2>Três acertos!</h2><p>A equipe pode tentar a vitória imediata.</p></div>':questionHtml(s);$('answers').innerHTML=answersHtml(s);if(!preserveForms)$('info').innerHTML=infoHtml(s);const roulette=rouletteHtml(s);$('roulette').hidden=!roulette;$('roulette').innerHTML=roulette;const mines=minesHtml(s);$('mines').hidden=!mines;$('mines').innerHTML=mines;const streak=streakWheelHtml(s);$('streak-wheel').hidden=!streak;$('streak-wheel').innerHTML=streak;document.body.classList.toggle('projector-game',projectorMode&&!!(roulette||mines||streak));$('roster').innerHTML=rosterHtml(s);if(!preserveForms)renderAdmin(s)}
    async function refresh(force=false){try{const s=await api('state');if(s.clientVersion&&s.clientVersion!==CLIENT_VERSION){const url=new URL(location.href);url.searchParams.set('v',s.clientVersion);location.replace(url.toString());return}if(s.phase==='bet'&&lastRound!==s.round)shuffle();lastRound=s.round;state=s;const preserveForms=!force&&['INPUT','SELECT'].includes(document.activeElement?.tagName);const signature=JSON.stringify(s);if(!force&&signature===lastSignature&&!['bet','answer','survival','mines','roulette_offer','mines_offer','roulette_choice'].includes(s.phase))return;render(preserveForms);lastSignature=signature}catch(e){$('message').textContent=e.message}}
    async function saveWinScore(){const value=$('winScore').value;if(await act('game-settings',{winScore:value}))$('winScore').value=state.winScore}
    async function saveTeamScore(team){const value=$('teamScore'+team).value;if(await act('game-settings',{team,score:value}))$('teamScore'+team).value=points(state.scores[team])}
    function join(){act('join',{name:$('name').value,team:$('team').value})}function login(){act('owner',{code:$('code').value})}
    function editQ(id){const q=state.questions.find(x=>x.id===id);editing=id;$('bankdetails').open=true;$('qt').value=q.text;q.options.forEach((v,i)=>$('o'+i).value=v);$('correct').value=q.correct;$('qt').focus();$('bankdetails').scrollIntoView({behavior:'smooth',block:'start'})}
    function clearQ(){editing=null;$('qt').value='';[0,1,2,3].forEach(i=>$('o'+i).value='');$('correct').value=0}
    async function saveQ(){if(await act('save',{id:editing,text:$('qt').value,options:[0,1,2,3].map(i=>$('o'+i).value),correct:Number($('correct').value)}))clearQ()}
    shuffle();refresh();setInterval(refresh,1000);
  </script>
